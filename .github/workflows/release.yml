name: "Release"

"on":
  push:
    tags:
      - 'v*' # Trigger on any tag matching v*, e.g., v0.1.7, v1.0.0

jobs:
  build-and-publish:
    name: Build, Release
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed for creating a GitHub release
      packages: write # Needed if eventually publishing to GitHub Packages
      id-token: write # Needed for NPM provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run Build
        run: pnpm run build

      - name: Run Tests
        run: pnpm test -- --run # Run tests once

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{steps.changelog.outputs.changelog}}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
          npm config set @testx1011:registry https://npm.pkg.github.com/

      - name: Publish to npm
        run: npm publish

name: "Release"

"on":
  push:
    tags:
      - 'v*' # Trigger on any tag matching v*, e.g., v0.1.7, v1.0.0

jobs:
  build-and-publish:
    name: Build, Release
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed for creating a GitHub release
      packages: write # Needed if eventually publishing to GitHub Packages
      id-token: write # Needed for NPM provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Install dependencies using npm (no lockfile present).
      - name: Install dependencies
        run: |
          npm ci || npm ci --legacy-peer-deps
      - name: Run Build
        run: npm run build

      - name: Run Tests
        run: npm run test -- --run # Run tests once

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{steps.changelog.outputs.changelog}}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm ci --legacy-peer-deps

      - name: Run linter
        run: |
          echo "Running ESLint..."
          npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: |
          echo "Running tests..."
          npm test -- --runInBand

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node-version: [22]
        package-manager: [npm, pnpm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ matrix.package-manager }}
          cache-dependency-path: ${{ matrix.package-manager == 'npm' && 'package-lock.json' || '' }}
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest (fixes provenance bugs)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: |
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm install
          fi

      - name: Run linter
        run: |
          echo "Running ESLint..."
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            pnpm run lint
          else
            npm run lint
          fi

      - name: Build
        run: |
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            pnpm run build
          else
            npm run build
          fi

      - name: Prepare Playwright browsers
        run: |
          echo "Installing Playwright browsers..."
          npx playwright install

      - name: Run tests
        run: |
          echo "Running tests..."
          if [ "${{ matrix.package-manager }}" = "pnpm" ]; then
            pnpm test
          else
            npm test
          fi

      - name: Publish to npm
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.package-manager == 'npm'
        run: npm publish --provenance
 